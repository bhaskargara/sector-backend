[project]
name = "sector-rocprompt-backend"
version = "0.2.0"
description = "Sector.ROCPrompt regulatory intelligence backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
